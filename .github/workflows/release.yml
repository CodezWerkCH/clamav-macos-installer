name: Bilingual release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  validate:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Validate bilingual release source
        run: |
          python3 scripts/test_release.py
          python3 scripts/release_notes.py
      - name: Validate tag version
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/release_notes.py --tag "$RELEASE_TAG"
      - name: Isolated regression tests
        run: python3 scripts/test.py
      - name: Build and verify signed app bundle
        run: python3 scripts/build.py
      - name: Package and verify both languages in every download
        run: |
          python3 scripts/package.py
          python3 scripts/release_notes.py --packages
      - uses: actions/upload-artifact@v4
        with:
          name: release-packages
          path: |
            dist/ClamAV-Installer-*.zip
            dist/SHA256SUMS.txt
          if-no-files-found: error
  publish:
    if: startsWith(github.ref, 'refs/tags/') && github.event_name == 'push'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          name: release-packages
          path: dist
      - name: Verify and publish the exact repository notes and packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/publish_release.py "$RELEASE_TAG"
